  /api/v1/search/products:
    post:
      operationId: products-api-v-1-search-products-post
      summary: Search Products
      description: |-
        Search products with text, category, price, and distance filters.

        **Access:** Authenticated (Buyer/Seller)
        **Rate limit:** User-based 120 requests per minute

        Uses full-text search on ``search_vector`` (GIN-indexed) for text queries,
        earthdistance (GIST-indexed) for geo filtering, and cursor pagination.
        When ``latitude``/``longitude`` are omitted, the user's default delivery
        location is used as the reference point for distance-based filters.
      tags:
        - subpackage_search
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_ProductResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearchRequest'
  /api/v1/search/sellers:
    post:
      operationId: sellers-api-v-1-search-sellers-post
      summary: Search Sellers
      description: |-
        Search sellers by seller/store name, location, products, rating, and favourites.

        **Access:** Authenticated (Buyer/Seller)
        **Rate limit:** User-based 120 requests per minute

        Uses trigram ILIKE search on ``store_name``, ``full_name``, ``city``,
        ``district``, and product names (GIN-indexed), earthdistance for geo
        queries, and supports ordering by ``rating``, ``distance``, or
        ``order_count``. Defaults to newest sellers when ``order_by`` is omitted.
      tags:
        - subpackage_search
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
