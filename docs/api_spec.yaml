openapi: 3.1.0
info:
  title: API Reference
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health-health-get
      summary: Health
      tags:
        - ''
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
  /api/v1/auth/register:
    post:
      operationId: register-api-v-1-auth-register-post
      summary: Register
      description: |-
        Register a new user with phone number and email.

        Access: Public
        Rate limit: IP-based 10 requests per minute
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_RegisterResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /api/v1/auth/login:
    post:
      operationId: login-api-v-1-auth-login-post
      summary: Login
      description: |-
        Authenticate user with email and password.

        Access: Public
        Rate limit: IP-based 10 requests per minute
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_TokenResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/v1/auth/refresh:
    post:
      operationId: refresh-api-v-1-auth-refresh-post
      summary: Refresh
      description: |-
        Refresh access token using a valid refresh token.

        Access: Public
        Rate limit: IP-based 30 requests per minute
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_TokenResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
  /api/v1/auth/logout:
    post:
      operationId: logout-api-v-1-auth-logout-post
      summary: Logout
      description: |-
        Log out the current authenticated user.

        Access: Authenticated (Buyer/Seller/Admin)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_auth
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_OTPResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
  /api/v1/auth/email/resend-otp:
    post:
      operationId: resend-email-otp-api-v-1-auth-email-resend-otp-post
      summary: Resend Email Otp
      description: |-
        Resend OTP to user's email for verification.

        Access: Public (IP rate limited)
        Rate limit: IP-based 3 requests per hour
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_OTPResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
  /api/v1/auth/email/verify-otp:
    post:
      operationId: verify-email-otp-api-v-1-auth-email-verify-otp-post
      summary: Verify Email Otp
      description: |-
        Verify email with OTP code.

        Access: Public (IP rate limited)
        Rate limit: IP-based 10 requests per hour
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_TokenResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailOTPRequest'
  /api/v1/auth/password/forgot:
    post:
      operationId: forgot-password-api-v-1-auth-password-forgot-post
      summary: Forgot Password
      description: |-
        Request password reset OTP via email.

        Access: Public
        Rate limit: IP-based 5 requests per hour
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_OTPResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
  /api/v1/auth/password/resend-otp:
    post:
      operationId: resend-password-otp-api-v-1-auth-password-resend-otp-post
      summary: Resend Password Otp
      description: |-
        Resend password reset OTP to email.

        Access: Public
        Rate limit: IP-based 5 requests per hour
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_OTPResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
  /api/v1/auth/password/verify-otp:
    post:
      operationId: verify-reset-otp-api-v-1-auth-password-verify-otp-post
      summary: Verify Reset Otp
      description: |-
        Verify password reset OTP and get reset token.

        Access: Public
        Rate limit: IP-based 10 requests per hour
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_VerifyResetOTPResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyResetOTPRequest'
  /api/v1/auth/password/reset:
    post:
      operationId: reset-password-api-v-1-auth-password-reset-post
      summary: Reset Password
      description: |-
        Reset password using a valid reset token.

        Access: Public
        Rate limit: IP-based 5 requests per hour
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_OTPResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
  /api/v1/auth/google:
    post:
      operationId: google-auth-api-v-1-auth-google-post
      summary: Google Auth
      description: |-
        Authenticate user with Google OAuth.

        Access: Public
        Rate limit: IP-based 10 requests per minute
      tags:
        - subpackage_auth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_TokenResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
  /api/v1/users/onboard:
    post:
      operationId: onboard-user-api-v-1-users-onboard-post
      summary: Onboard User
      description: |-
        Onboard the authenticated user after email verification.

        Saves onboarding data (free-form JSON) and creates the user's
        default location. Missing details are resolved via Geoapify
        geocoding. When using text, the raw address is stored as
        formatted address.

        Access: Authenticated (Buyer/Seller)
        Rate limit: User-based 10 requests per minute
      tags:
        - subpackage_users
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_OnboardUserResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardUserRequest'
  /api/v1/users/me:
    get:
      operationId: get-current-user-api-v-1-users-me-get
      summary: Get Current User
      description: |-
        Get current authenticated user's profile information.

        Access: Authenticated (Buyer/Seller/Admin)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_users
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse_'
    delete:
      operationId: delete-current-user-api-v-1-users-me-delete
      summary: Delete Current User
      description: |-
        Soft-delete the authenticated user's account.

        Sets deleted_at timestamp, revokes all refresh tokens, and blacklists
        the current access token. Soft-deleted users cannot log in or access
        protected endpoints.

        Access: Authenticated (Buyer/Seller/Admin)
        Rate limit: User-based 10 requests per minute
      tags:
        - subpackage_users
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties: {}
    patch:
      operationId: update-current-user-api-v-1-users-me-patch
      summary: Update Current User
      description: |-
        Update current authenticated user's profile details.

        Access: Authenticated (Buyer/Seller/Admin)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_users
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
  /api/v1/users/me/profile-image:
    delete:
      operationId: delete-profile-image-api-v-1-users-me-profile-image-delete
      summary: Delete Profile Image
      description: |-
        Delete the authenticated user's profile image.

        Clears the profile_image_url field and removes the image from Cloudinary.

        Access: Authenticated (Buyer/Seller/Admin)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_users
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse_'
  /api/v1/users/me/banner-image:
    delete:
      operationId: delete-banner-image-api-v-1-users-me-banner-image-delete
      summary: Delete Banner Image
      description: |-
        Delete the authenticated user's banner image.

        Clears the banner_image_url field and removes the image from Cloudinary.

        Access: Authenticated (Buyer/Seller/Admin)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_users
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_UserResponse_'
  /api/v1/locations/autocomplete:
    get:
      operationId: autocomplete-api-v-1-locations-autocomplete-get
      summary: Autocomplete
      description: |-
        Address autocomplete via Geoapify. Returns suggested addresses for a partial query.

        - `q`: partial address text (min 2 characters)
        - `type`: filter by location type (country, state, city, postcode, street, amenity, locality)
        - `limit`: max results (default 5, max 20)
        - `lat`/`lon`: optional bias point to prefer nearby results

        Access: Public (IP rate limited: 60 req/min)
      tags:
        - subpackage_locations
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
        - name: lat
          in: query
          required: false
          schema:
            type:
              - number
              - 'null'
            format: double
        - name: lon
          in: query
          required: false
          schema:
            type:
              - number
              - 'null'
            format: double
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_list_AutocompleteItem__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/locations/:
    get:
      operationId: list-locations-api-v-1-locations-get
      summary: List Locations
      description: |-
        List saved locations for the authenticated user with cursor pagination.

        Access: Authenticated (Buyer/Seller)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_locations
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_LocationResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      operationId: create-location-api-v-1-locations-post
      summary: Create Location
      description: |-
        Create a new saved location for the authenticated user.
        Provide formatted address with (optional) lat and lon for improving geocoding accuracy.
        Or just provide lat and lon for reverse geocoding.

        Access: Authenticated (Buyer/Seller)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_locations
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_LocationResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLocationRequest'
  /api/v1/locations/popular:
    get:
      operationId: list-popular-locations-api-v-1-locations-popular-get
      summary: List Popular Locations
      description: |-
        List popular locations aggregated by region with average rating,
        hustler count, and distance from a reference point.

        - `sort`: comma-separated sort fields, e.g. `number_of_hustlers` or `avg_rating,number_of_hustlers`
        - `lat`/`lon`: reference point for distance calculation (falls back to user's default location)
        - `max_distance_km`: filter results within this distance (requires lat/lon)

        Access: Authenticated
        Rate limit: User-based 100 requests per minute
      tags:
        - subpackage_locations
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: lat
          in: query
          required: false
          schema:
            type:
              - number
              - 'null'
            format: double
        - name: lon
          in: query
          required: false
          schema:
            type:
              - number
              - 'null'
            format: double
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: number_of_hustlers
        - name: max_distance_km
          in: query
          required: false
          schema:
            type:
              - number
              - 'null'
            format: double
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_PopularLocationResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/locations/default:
    get:
      operationId: get-default-location-api-v-1-locations-default-get
      summary: Get Default Location
      description: |-
        Get the authenticated user's default location, if any.

        Access: Authenticated (Buyer/Seller)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_locations
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_Union_LocationResponse__NoneType__'
  /api/v1/locations/{location_id}:
    delete:
      operationId: delete-location-api-v-1-locations-location-id-delete
      summary: Delete Location
      description: |-
        Delete a saved location by ID.

        Access: Authenticated (Buyer/Seller)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_locations
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      operationId: update-location-api-v-1-locations-location-id-patch
      summary: Update Location
      description: |-
        Update a saved location by ID.

        If the address field changes, lat/lon is
        recomputed via forward geocoding.

        Access: Authenticated (Buyer/Seller)
        Rate limit: User-based 300 requests per minute
      tags:
        - subpackage_locations
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_LocationResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLocationRequest'
  /api/v1/categories/:
    get:
      operationId: list-categories-api-v-1-categories-get
      summary: List Categories
      description: |-
        List all product categories with cursor pagination.

        Access: Public
        Rate limit: IP-based 100 requests per minute
      tags:
        - subpackage_categories
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse_CategoryResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      operationId: create-category-api-v-1-categories-post
      summary: Create Category
      description: |-
        Create a new category.

        Access: Authenticated Seller or Admin
        Rate limit: User-based 30 requests per minute
      tags:
        - subpackage_categories
      parameters:
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_CategoryResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
  /api/v1/categories/{category_id}:
    get:
      operationId: get-category-api-v-1-categories-category-id-get
      summary: Get Category
      description: |-
        Get a single category by ID.

        Access: Public
        Rate limit: IP-based 100 requests per minute
      tags:
        - subpackage_categories
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse_CategoryResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      operationId: delete-category-api-v-1-categories-category-id-delete
      summary: Delete Category
      description: |-
        Delete a category.

        Access: Creator or Admin
        Rate limit: User-based 30 requests per minute
      tags:
        - subpackage_categories
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Authorization
          in: header
          description: Bearer authentication
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      operationId: update-category-api-v-1-categories-category-id-patch
      summary: Update Category
      description: |-
