[project]
name = "hustlers-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosmtplib>=5.1.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "authlib>=1.7.0",
    "cloudinary>=1.44.2",
    "fastapi>=0.136.1",
    "google-auth>=2.49.2",
    "google-maps-places>=0.1.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.26",
    "resend[async]>=2.29.0",
    "sentry-sdk>=2.58.0",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.46.0",
    "python-jose>=3.5.0",
    "ably>=3.1.2",
    "gunicorn>=25.3.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.13.5",
    "detect-secrets>=1.5.0",
    "faker>=40.15.0",
    "pip-audit>=2.10.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-docker>=3.2.5",
    "ruff>=0.15.12",
    "taskipy>=1.14.1",
    "ty>=0.0.32",
]


[tool.taskipy.tasks]
dev = "uvicorn src.main:app --reload"
start = "alembic upgrade head && gunicorn src.main:app -k uvicorn.workers.UvicornWorker"
migrate-create = "alembic revision --autogenerate -m"
migrate = "alembic upgrade head"
migrate-current-check = "alembic current"
migrate-history-check = "alembic history --verbose"
test = "pytest"
test-cov = "pytest --cov"
lint = "ruff check ."
format = "ruff format ."
typecheck = "ty check ."
audit = "pip-audit"
pre-commit-install = "pre-commit install && pre-commit install --hook-type pre-push"
pre-commit-run = "pre-commit run --all-files"
secrets-scan = "detect-secrets scan > .secrets.baseline"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"alembic/env.py" = ["F403"]


[tool.bandits]
exclude = ["tests/"]


[tool.pytest.ini_options]
testpaths = ["tests"]
# addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
