services:
  db:
    image: postgres:16-alpine
    container_name: hustlers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hustlers_db_test}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hustlers_backend_postgres_test:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres_test} -d ${POSTGRES_DB:-hustlers_db_test}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  hustlers_backend_postgres_test:
