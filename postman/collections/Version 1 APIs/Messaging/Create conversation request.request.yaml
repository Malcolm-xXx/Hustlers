$kind: http-request
name: Create conversation request
url: "{{base_url}}/api/v1/messaging/conversations/"
method: POST
body:
  type: json
  content: |-
    {
      "order_id": "{{order_id}}",
      "participant_user_id": "{{participant_user_id}}"
    }
description: |-
  Create a conversation.

  Auth: IsAuthenticated.
  Body: order_id or participant_user_id.

  Success response: `201 Created`

  ```json
  {
    "id": "uuid",
    "status": "active",
    "order_id": "uuid",
    "peer": {
      "id": "uuid",
      "full_name": "string",
      "profile_photo": "url"
    },
    "latest_message_preview": "string",
    "latest_message_at": "2024-01-15T10:30:00Z",
    "unread_count": 2,
    "muted_until": null,
    "cleared_at": null,
    "messages": []
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
