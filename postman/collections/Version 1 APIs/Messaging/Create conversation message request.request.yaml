$kind: http-request
name: Create conversation message request
url: "{{base_url}}/api/v1/messaging/conversations/{{conversation_id}}/messages/"
method: POST
body:
  type: json
  content: |-
    {
      "body": "{{body}}",
      "message_type": "{{message_type}}"
    }
description: |-
  Create a conversation message.

  Auth: IsAuthenticated.
  Body: body, message_type.

  Success response: `201 Created`

  ```json
  {
    "id": "uuid",
    "status": "active",
    "order_id": "uuid",
    "peer": {
      "id": "uuid",
      "full_name": "string",
      "profile_photo": "url"
    },
    "latest_message_preview": "string",
    "latest_message_at": "2024-01-15T10:30:00Z",
    "unread_count": 2,
    "muted_until": null,
    "cleared_at": null,
    "messages": [
      {
        "id": "uuid",
        "sender_user_id": "uuid",
        "body": "string",
        "created_at": "2024-01-15T10:30:00Z"
      }
    ]
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
