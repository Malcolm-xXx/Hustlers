$kind: http-request
name: My trust reports request
url: "{{base_url}}/api/v1/trust/reports/me/"
method: GET
description: |-
  List reports filed by the authenticated user.

  Auth: IsAuthenticated.

  Success response: `200 OK`

  ```json
  {
    "count": 1,
    "next": null,
    "previous": null,
    "results": [
      {
        "id": "uuid",
        "reported_user": {
          "id": "uuid",
          "full_name": "string",
          "email": "user@example.com",
          "role": "buyer",
          "is_onboarded": true
        },
        "reason_type": "harassment",
        "details": "string",
        "status": "pending",
        "created_at": "2024-01-15T10:30:00Z"
      }
    ]
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
