$kind: http-request
name: Trust face capture request
url: "{{base_url}}/api/v1/trust/verification/face-capture-from-url/"
method: POST
body:
  type: json
  content: '{"face_capture_image_url": "{{face_capture_image_url}}", "face_capture_image_public_id": "{{face_capture_image_public_id}}"}'
description: |-
  Finalize a face capture upload after uploading directly to Cloudinary.

  Auth: IsAuthenticated.
  Body: JSON with `face_capture_image_url` and `face_capture_image_public_id`.

  Success response: `200 OK`

  ```json
   {
     "status": "not_started",
     "id_document_type": "id_card",
     "id_document_uploaded": true,
     "face_capture_uploaded": true,
     "failure_reason": null,
     "submitted_at": null,
     "verified_at": null
   }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
