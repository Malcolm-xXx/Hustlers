$kind: http-request
name: Seller top listings analytics request
url: "{{base_url}}/api/v1/analytics/seller/top-listings/"
method: GET
description: |-
  Fetch top-performing seller listings.

  Auth: IsAuthenticated + Seller role required.
   Query params: range (today | week | month), limit (default: 5).

  Success response: `200 OK`

  ```json
  [
    {
      "product": {
        "id": "uuid",
        "name": "string",
        "unit_label": "string",
        "seller": { "id": "uuid", "store_name": "string" },
        "base_price": "100.00",
        "discounted_price": null,
        "is_on_sale": false,
        "is_low_stock": false,
        "image_url": "url",
        "category": "string"
      },
      "gross_sales_amount": "500.00",
      "views_count": 100,
      "orders_count": 10
    }
  ]
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
