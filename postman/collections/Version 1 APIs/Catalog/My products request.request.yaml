$kind: http-request
name: My products request
url: "{{base_url}}/api/v1/catalog/me/products/"
method: GET
description: |-
  List the authenticated seller's products.

  Auth: IsAuthenticated + Seller role required.
  Query params: status (draft|published|archived), category, search.

  Success response: `200 OK`

  ```json
  {
    "count": 1,
    "next": null,
    "previous": null,
    "results": [
      {
        "id": "uuid",
        "name": "string",
        "unit_label": "string",
        "seller": { "id": "uuid", "store_name": "string" },
        "base_price": "100.00",
        "discounted_price": null,
        "is_on_sale": false,
        "is_low_stock": false,
        "image_url": "url",
        "category": "string"
      }
    ]
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
