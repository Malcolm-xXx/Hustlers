$kind: http-request
name: Update sale campaign request
url: "{{base_url}}/api/v1/catalog/sale-campaigns/{{campaign_id}}/"
method: PATCH
body:
  type: json
  content: |-
    {
      "name": "{{name}}",
      "campaign_type": "{{campaign_type}}",
      "discount_percent": {{discount_percent}},
      "starts_at": "{{starts_at}}",
      "ends_at": "{{ends_at}}",
      "product_ids": ["{{product_id_1}}", "{{product_id_2}}"]
    }
description: |-
  Update a sale campaign.

  Auth: IsAuthenticated + Seller role required (must own the campaign).
  Body: name, campaign_type, discount_percent, starts_at, ends_at, product_ids (all optional for partial update; product_ids cannot be empty if provided).

  Success response: `200 OK`

  ```json
  {
    "id": "uuid",
    "name": "string",
    "campaign_type": "single_item",
    "discount_percent": "10.00",
    "starts_at": "2024-01-15T00:00:00Z",
    "ends_at": "2024-01-22T00:00:00Z",
    "status": "scheduled",
    "items": [
      { "product_id": "uuid", "discounted_price": "90.00" }
    ]
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
