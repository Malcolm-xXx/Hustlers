$kind: http-request
name: Update my seller tags request
url: "{{base_url}}/api/v1/catalog/me/tags/"
method: PUT
body:
  type: json
  content: |-
    {
      "tag_ids": ["{{tag_id_1}}", "{{tag_id_2}}"]
    }
description: |-
  Replace all tags for the authenticated seller.

  Auth: IsAuthenticated + Seller role required.
  Body: tag_ids (list of UUIDs).

  Success response: `200 OK`

  ```json
  [
    {
      "id": "uuid",
      "tag": {
        "id": "uuid",
        "name": "string",
        "slug": "string",
        "tag_scope": "seller"
      }
    }
  ]
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
