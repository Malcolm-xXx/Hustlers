$kind: http-request
name: Create complaint request
url: "{{base_url}}/api/v1/orders/{{order_id}}/complaint/"
method: POST
body:
  type: json
  content: |-
    {
      "comment": "{{comment}}",
      "tags": {{tags}}
    }
description: |-
  Submit an order complaint.

  Auth: IsAuthenticated + Seller role required.
  Body: comment, tags.

   Success response: `201 Created`

  ```json
  {
    "order": {
      "id": "uuid",
      "order_number": "ORD-2024-001",
      "status": "DONE",
      "payment_status": "PAID",
      "buyer": { "id": "uuid", "full_name": "string", "email": "email" },
      "seller": { "id": "uuid", "store_name": "string", "location": "string", "rating": "4.50" },
      "eta_minutes": null,
      "delivery_address_text": "123 Main St",
      "items_count": 3,
      "total_amount": "150.00",
      "created_at": "2024-01-15T10:30:00Z",
      "items": [...],
      "review": null,
      "complaint": {
        "tags": ["wrong_items", "quality_issues"],
        "comment": "Customer received wrong items",
        "created_at": "2024-01-15T12:00:00Z"
      }
    },
    "complaint": {
      "tags": ["wrong_items", "quality_issues"],
      "comment": "Customer received wrong items",
      "created_at": "2024-01-15T12:00:00Z"
    }
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
