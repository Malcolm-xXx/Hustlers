$kind: http-request
name: Adjustment decision request
url: "{{base_url}}/api/v1/orders/{{order_id}}/adjustments/{{adjustment_id}}/decision/"
method: POST
body:
  type: json
  content: |-
    {
      "decision": "{{decision}}"
    }
description: |-
  Approve or reject an adjustment.

  Auth: IsAuthenticated + Buyer role required.
  Body: decision (approve | reject).

  Success response: `200 OK`

  ```json
  {
    "id": "uuid",
    "order_number": "ORD-2024-001",
