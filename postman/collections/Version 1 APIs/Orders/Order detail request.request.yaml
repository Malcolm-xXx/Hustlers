$kind: http-request
name: Order detail request
url: "{{base_url}}/api/v1/orders/{{order_id}}/"
method: GET
description: |-
  Fetch an order by ID.

  Auth: IsAuthenticated + buyer, seller, or staff required.

  Success response: `200 OK`

  ```json
  {
    "id": "uuid",
     "order_number": "ORD-2024-001",
     "status": "shopping",
     "payment_status": "paid",
    "buyer": { "id": "uuid", "full_name": "string", "email": "email" },
    "seller": { "id": "uuid", "store_name": "string", "location": "string", "rating": "4.50" },
    "eta_minutes": 30,
    "delivery_address_text": "123 Main St",
    "items_count": 3,
    "total_amount": "150.00",
    "created_at": "2024-01-15T10:30:00Z",
    "pickup_location": { "id": "uuid", "name": "string", "address_text": "string", "latitude": 40.7128, "longitude": -74.0060 },
    "delivery_address": { "id": "uuid", "location": { "id": "uuid", "name": "string", "address_text": "string", "latitude": 40.7128, "longitude": -74.0060 }, "is_default": true, "created_at": "2024-01-01T00:00:00Z" },
    "special_instructions": "Please ring doorbell",
    "status_events": [
       { "status": "accepted", "actor_user_id": "uuid", "created_at": "2024-01-15T10:30:00Z" }
    ],
    "items": [
      {
        "id": "uuid",
        "display_name": "Organic Milk",
        "quantity": 2,
        "unit_label": "liter",
        "base_unit_price": "25.00",
        "final_unit_price": "25.00",
        "line_total": "50.00",
         "fulfillment_status": "pending"
      }
    ],
    "review": null,
    "complaint": null
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
