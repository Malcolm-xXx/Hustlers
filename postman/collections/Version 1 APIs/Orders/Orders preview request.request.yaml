    "cart": {
      "id": "uuid",
      "status": "active",
      "items": [
        {
          "id": "uuid",
          "product": {
            "id": "uuid",
            "name": "string",
            "unit_label": "string",
            "seller": { "id": "uuid", "store_name": "string" },
            "base_price": "100.00",
            "discounted_price": null,
            "is_on_sale": false,
            "is_low_stock": false,
            "image_url": "url",
            "category": "string"
          },
          "quantity": 1,
          "line_total": "100.00"
        }
      ],
      "seller_count": 1,
      "subtotal_amount": "100.00"
    },
    "order_groups": [
      {
        "seller": {
          "id": "uuid",
          "store_name": "string",
          "profile_image": "url",
          "status": "active",
          "rating": "4.50",
          "rating_count": 10,
