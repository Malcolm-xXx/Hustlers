$kind: http-request
name: Create marketplace list request
url: "{{base_url}}/api/v1/marketplace/lists/"
method: POST
body:
  type: json
  content: |-
    {
      "title": "{{title}}",
      "shopping_location_id": "{{shopping_location_id}}",
      "delivery_address_id": "{{delivery_address_id}}",
      "delivery_fee": {{delivery_fee}},
      "delivery_window_start": "{{delivery_window_start}}",
      "delivery_window_end": "{{delivery_window_end}}",
      "delivery_window_label": "{{delivery_window_label}}",
      "notes": "{{notes}}",
      "items": {{items}},
      "latitude": {{latitude}},
      "longitude": {{longitude}}
    }
description: |-
  Create a hustle list.

  Auth: IsAuthenticated + Buyer role required.
  Body: list fields from the docs.

  Success response: `201 Created`

  ```json
  {
    "id": "uuid",
    "title": "string",
    "status": "draft",
    "items_count": 3,
    "subtotal": "150.00",
    "delivery_fee": "20.00",
    "delivery_window_label": "Today 2-4 PM",
    "shopping_location": { "id": "uuid", "name": "string", "address_text": "string", "latitude": 40.7128, "longitude": -74.0060 },
    "created_at": "2024-01-15T10:30:00Z",
    "delivery_address": { "id": "uuid", "location": { "id": "uuid", "name": "string", "address_text": "string", "latitude": 40.7128, "longitude": -74.0060 }, "is_default": true, "created_at": "2024-01-01T00:00:00Z" },
    "notes": "string",
    "items": [
      {
        "id": "uuid",
        "requested_name": "string",
        "quantity_value": 1,
        "unit_label": "string",
        "target_price": "50.00",
        "note": "string"
      }
    ],
    "dispatches": []
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
