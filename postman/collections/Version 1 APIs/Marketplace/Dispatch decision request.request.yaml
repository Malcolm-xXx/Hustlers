$kind: http-request
name: Dispatch decision request
url: "{{base_url}}/api/v1/marketplace/dispatches/{{dispatch_id}}/decision/"
method: POST
body:
  type: json
  content: |-
    {
      "action": "{{action}}",
      "note": "{{note}}"
    }
description: |-
  Accept or decline a dispatch.

  Auth: IsAuthenticated + Seller role required.
  Body: action, note.

  Success response: `200 OK`

  Accept response:
  ```json
  {
    "dispatch": {
      "id": "uuid",
      "channel": "direct",
      "status": "accepted",
      "target_seller": { "id": "uuid", "store_name": "string", "profile_image": "url", "status": "active", "rating": "4.50", "rating_count": 10, "completed_orders_count": 50, "distance_km": 1.5, "tags": ["string"], "is_favorite": false },
      "accepted_by_seller": { "id": "uuid", "store_name": "string", "profile_image": "url", "status": "active", "rating": "4.50", "rating_count": 10, "completed_orders_count": 50, "distance_km": 1.5, "tags": ["string"], "is_favorite": false },
      "sent_at": "2024-01-15T10:30:00Z",
      "responded_at": "2024-01-15T10:35:00Z",
      "expires_at": "2024-01-15T18:30:00Z"
    },
    "order": {
      "id": "uuid",
      "order_number": "ORD-001",
      "status": "accepted",
      "payment_status": "pending",
      "created_at": "2024-01-15T10:35:00Z"
    }
  }
  ```

  Decline response:
  ```json
  {
    "dispatch": {
      "id": "uuid",
      "channel": "direct",
      "status": "declined",
      "target_seller": { "id": "uuid", "store_name": "string", "profile_image": "url", "status": "active", "rating": "4.50", "rating_count": 10, "completed_orders_count": 50, "distance_km": 1.5, "tags": ["string"], "is_favorite": false },
      "accepted_by_seller": null,
      "sent_at": "2024-01-15T10:30:00Z",
      "responded_at": "2024-01-15T10:35:00Z",
      "expires_at": "2024-01-15T18:30:00Z"
    },
    "order": null
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
