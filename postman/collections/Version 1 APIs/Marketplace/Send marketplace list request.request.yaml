$kind: http-request
name: Send marketplace list request
url: "{{base_url}}/api/v1/marketplace/lists/{{list_id}}/send/"
method: POST
body:
  type: json
  content: |-
    {
      "seller_id": "{{seller_id}}",
      "message": "{{message}}",
      "expires_at": "{{expires_at}}"
    }
description: |-
  Send a hustle list to a seller.

  Auth: IsAuthenticated + Buyer role required.
  Body: seller_id, message, expires_at.

  Success response: `200 OK`

  ```json
  {
    "list": {
      "id": "uuid",
      "title": "string",
      "status": "sent_direct",
      "items_count": 3,
      "subtotal": "150.00",
      "delivery_fee": "20.00",
      "delivery_window_label": "Today 2-4 PM",
      "shopping_location": { "id": "uuid", "name": "string", "address_text": "string", "latitude": 40.7128, "longitude": -74.0060 },
      "created_at": "2024-01-15T10:30:00Z",
      "delivery_address": { "id": "uuid", "location": { "id": "uuid", "name": "string", "address_text": "string", "latitude": 40.7128, "longitude": -74.0060 }, "is_default": true, "created_at": "2024-01-01T00:00:00Z" },
      "notes": "string",
      "items": [
        {
          "id": "uuid",
          "requested_name": "string",
          "quantity_value": 1,
          "unit_label": "string",
          "target_price": "50.00",
          "note": "string"
        }
      ],
      "dispatches": []
    },
    "dispatch": {
      "id": "uuid",
      "channel": "direct",
      "status": "pending",
      "target_seller": { "id": "uuid", "store_name": "string", "profile_image": "url", "status": "active", "rating": "4.50", "rating_count": 10, "completed_orders_count": 50, "distance_km": 1.5, "tags": ["string"], "is_favorite": false },
      "accepted_by_seller": null,
      "sent_at": "2024-01-15T10:30:00Z",
      "responded_at": null,
      "expires_at": "2024-01-15T18:30:00Z"
    }
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
