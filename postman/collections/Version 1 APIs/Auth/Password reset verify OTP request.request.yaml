$kind: http-request
name: Password reset verify OTP request
url: "{{base_url}}/api/v1/auth/password/reset/verify-otp/"
method: POST
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "otp": "{{otp}}"
    }
order: 1776961561558
description: |-
  Verify the password reset OTP.

  Auth: Public

  Request body:
  ```json
  {
  "email": "email",
   "otp": "6-digit numeric string"
  }
  ```

  Success response: `200 OK`

  ```json
  {
  "detail": "Reset code verified successfully.",
  "verification_token": "32-character url-safe token"
  }
  ```

  Error response: `400 Bad Request`

  ```json
  {
  "detail": "Invalid or expired reset code."
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
