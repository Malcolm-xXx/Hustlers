$kind: http-example
request:
  url: "{{base_url}}/api/v1/auth/register/"
  method: POST
  body:
    type: json
    content: |-
      {
        "full_name": "{{full_name}}",
        "phone_number": "{{phone_number}}",
        "email": "{{email}}",
        "password": "{{password}}",
        "confirm_password": "{{confirm_password}}"
