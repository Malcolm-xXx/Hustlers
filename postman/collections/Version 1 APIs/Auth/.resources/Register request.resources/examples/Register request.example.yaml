  statusText: Created
  body:
    type: json
    content: |-
      {
        "id": "uuid",
        "full_name": "string",
        "email": "email",
        "role": "string",
        "is_onboarded": false,
        "detail": "Verification OTP sent to email.",
        "requires_email_verification": true
      }
