$kind: http-request
name: Me address update request
url: "{{base_url}}/api/v1/auth/me/addresses/{{address_id}}/"
method: PATCH
body:
  type: json
  content: |-
    {
      "name": "{{name}}",
      "latitude": {{latitude}},
      "longitude": {{longitude}},
      "address_text": "{{address_text}}",
      "is_default": false
    }
order: 1776961561566
description: |-
  Update a saved address.

  Auth: IsAuthenticated

  Path variable:
  - `address_id`: UUID of the saved address

  Request body:
   ```json
   {
     "name": "string (optional)",
     "latitude": number (optional),
     "longitude": number (optional),
     "address_text": "string (optional)",
     "is_default": boolean (optional)
   }
   ```

  Success response: `200 OK`

  Same shape as `GET /api/v1/auth/me/addresses/<uuid:address_id>/`.

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
