$kind: http-request
name: Me address delete request
url: "{{base_url}}/api/v1/auth/me/addresses/{{address_id}}/"
method: DELETE
order: 1776961561567
description: |-
  Delete a saved address.

  Auth: IsAuthenticated

  Path variable:
  - `address_id`: UUID of the saved address

  Success response: `204 No Content`

  If the deleted address was the default one, the next available address becomes default.

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
