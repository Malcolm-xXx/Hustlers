$kind: http-request
name: Password reset request
url: "{{base_url}}/api/v1/auth/password/reset/request/"
method: POST
body:
  type: json
  content: |-
    {
      "email": "{{email}}"
    }
order: 1776961561557
description: |-
  Start the password reset flow by sending an OTP to the user's email.

  Auth: Public

  Request body:
  ```json
  {
  "email": "email"
  }
  ```

  Success response: `200 OK`

  ```json
  {
  "detail": "Password reset OTP sent if account exists."
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
