$kind: http-request
name: Me addresses create request
url: "{{base_url}}/api/v1/auth/me/addresses/"
method: POST
body:
  type: json
  content: |-
    {
      "name": "{{name}}",
      "latitude": {{latitude}},
      "longitude": {{longitude}},
      "address_text": "{{address_text}}",
      "is_default": false
    }
order: 1776961561564
description: |-
  Create a saved address for the authenticated user.

  Auth: IsAuthenticated

  Request body:
  ```json
   {
   "name": "string",
   "latitude": number,
   "longitude": number,
   "address_text": "string (optional)",
   "is_default": boolean (optional)
   }
  ```

  Success response: `201 Created`

  Same shape as a single `GET /api/v1/auth/me/addresses/<uuid:address_id>/` response.

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
