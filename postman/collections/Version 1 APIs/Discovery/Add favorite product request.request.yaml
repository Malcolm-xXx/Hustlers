$kind: http-request
name: Add favorite product request
url: "{{base_url}}/api/v1/discovery/favorites/products/"
method: POST
body:
  type: json
  content: |-
    {
      "product_id": "{{product_id}}"
    }
description: |-
  Add a product to favorites.

  Auth: IsAuthenticated + Buyer role required.
  Body: product_id.

  Success response: `201 Created`

   ```json
   {
     "id": "uuid",
     "name": "string",
     "unit_label": "string",
     "seller": { "id": "uuid", "store_name": "string" },
     "base_price": "100.00",
     "discounted_price": null,
     "is_on_sale": false,
     "is_low_stock": false,
     "image_url": "url",
     "category": "string"
   }
   ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
