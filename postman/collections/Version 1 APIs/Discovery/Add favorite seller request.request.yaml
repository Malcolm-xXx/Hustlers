$kind: http-request
name: Add favorite seller request
url: "{{base_url}}/api/v1/discovery/favorites/sellers/"
method: POST
body:
  type: json
  content: |-
    {
      "seller_id": "{{seller_id}}"
    }
description: |-
  Add a seller to favorites.

  Auth: IsAuthenticated + Buyer role required.
  Body: seller_id.

  Success response: `201 Created`

   ```json
   {
     "id": "uuid",
     "store_name": "string",
     "profile_image": "url",
     "status": "active",
     "rating": "4.50",
     "rating_count": 10,
     "completed_orders_count": 50,
     "distance_km": 1.5,
     "tags": ["string"],
     "is_favorite": true
   }
   ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
