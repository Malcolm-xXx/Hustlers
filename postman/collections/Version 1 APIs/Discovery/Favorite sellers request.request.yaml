$kind: http-request
name: Favorite sellers request
url: "{{base_url}}/api/v1/discovery/favorites/sellers/"
method: GET
description: |-
  List favorite sellers.

  Auth: IsAuthenticated + Buyer role required.

  Success response: `200 OK`

  ```json
  {
    "count": 1,
    "next": null,
    "previous": null,
    "results": [
      {
        "id": "uuid",
        "store_name": "string",
        "profile_image": "url",
        "status": "active",
        "rating": "4.50",
        "rating_count": 10,
        "completed_orders_count": 50,
        "distance_km": 1.5,
        "tags": ["string"],
        "is_favorite": true
      }
    ]
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
