$kind: http-request
name: Seller wallet request
url: "{{base_url}}/api/v1/sellers/me/wallet/"
method: GET
description: |-
  Fetch the authenticated seller's wallet summary.

  Auth: IsAuthenticated + Seller role required.

  Success response: `200 OK`

  ```json
  {
    "wallet": {
      "wallet_id": "uuid",
      "currency_code": "NGN",
      "available_balance": "100.00",
      "pending_balance": "50.00"
    },
    "amount_in_today": "150.00"
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
