$kind: http-request
name: Seller high demand areas request
url: "{{base_url}}/api/v1/sellers/me/areas/high-demand/"
method: GET
description: |-
  Fetch high-demand areas for the seller.

  Auth: IsAuthenticated + Seller role required.

  Success response: `200 OK`

  ```json
  [
    {
      "id": "uuid",
      "name": "string",
      "address_text": "string",
      "latitude": 40.7128,
      "longitude": -74.0060
    }
  ]
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
