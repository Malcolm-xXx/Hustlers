$kind: http-request
name: Seller active orders request
url: "{{base_url}}/api/v1/sellers/me/orders/active/"
method: GET
description: |-
  Fetch the authenticated seller's active orders.

  Auth: IsAuthenticated + Seller role required.
  Query params: page, page_size.

  Success response: `200 OK`

  ```json
  {
    "count": 1,
    "next": null,
    "previous": null,
    "results": [
      {
        "id": "uuid",
        "order_number": "ORD-2024-001",
         "status": "accepted",
        "payment_status": "PAID",
        "buyer": { "id": "uuid", "full_name": "string", "phone_number": "string" },
        "seller": { "id": "uuid", "store_name": "string", "profile_image": "url", "status": "active", "rating": "4.50", "rating_count": 10, "completed_orders_count": 50, "distance_km": 1.5, "tags": ["string"], "is_favorite": false },
        "eta_minutes": 30,
        "delivery_address_text": "123 Main St",
        "items_count": 3,
        "total_amount": "150.00",
        "created_at": "2024-01-15T10:30:00Z"
      }
    ]
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
