$kind: http-request
name: Delete seller service area request
url: "{{base_url}}/api/v1/sellers/me/service-areas/{{service_area_id}}/"
method: DELETE
description: |-
  Delete a seller service area.

  Auth: IsAuthenticated + Seller role required.

  Success response: `204 No Content`

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
