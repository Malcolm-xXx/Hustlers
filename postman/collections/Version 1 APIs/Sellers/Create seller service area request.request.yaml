$kind: http-request
name: Create seller service area request
url: "{{base_url}}/api/v1/sellers/me/service-areas/"
method: POST
body:
  type: json
  content: |-
    {
      "location_id": "{{location_id}}"
    }
description: |-
  Create a seller service area.

  Auth: IsAuthenticated + Seller role required.
  Body: service area fields from the docs.

  Success response: `201 Created`

   ```json
   {
     "id": "uuid",
     "location": { "id": "uuid", "name": "string", "address_text": "string", "latitude": 40.7128, "longitude": -74.0060 },
     "is_active": true,
     "created_at": "2024-01-01T00:00:00Z"
   }
   ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
