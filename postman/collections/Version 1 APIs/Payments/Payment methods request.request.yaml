$kind: http-request
name: Payment methods request
url: "{{base_url}}/api/v1/payments/payment-methods/"
method: GET
description: |-
  List payment methods.

  Auth: IsAuthenticated.

  Success response: `200 OK`

  ```json
  [
    {
      "id": "uuid",
      "method_type": "card",
      "brand": "visa",
      "last4": "4242",
      "expiry_month": 12,
      "expiry_year": 2025,
      "is_default": true
    }
  ]
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
