$kind: http-request
name: Payment detail request
url: "{{base_url}}/api/v1/payments/payments/{{payment_id}}/"
method: GET
description: |-
  Fetch payment details.

  Auth: IsAuthenticated.

  Success response: `200 OK`

  ```json
  {
    "id": "uuid",
    "payment_method": "card",
    "status": "pending",
    "amount": "100.00",
    "reference": "pay_uuid",
    "authorization_url": "https://payment-provider.com/pay/pay_uuid"
  }
  ```

  Common errors:
  - `400 Bad Request`: validation error response
  - `401 Unauthorized`: authentication required
  - `403 Forbidden`: permission denied
  - `404 Not Found`: resource does not exist
