services:
  db:
    image: postgres:16-alpine
    container_name: hustlers-postgres
    restart: unless-stopped
    networks:
      - hustlers_network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hustlers_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hustlers_backend_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hustlers_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: hustlers-pgadmin
    restart: unless-stopped
    networks:
      - hustlers_network
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hustlers_backend_pgadmin_data:/var/lib/pgadmin

volumes:
  hustlers_backend_postgres:
  hustlers_backend_pgadmin_data:

networks:
  hustlers_network:
    name: hustlers_network
    driver: bridge
